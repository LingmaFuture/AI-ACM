[project]
name = "ai-acm-api"
version = "0.1.0"
description = "AI 算法刷题社区后端"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "itsdangerous>=2.2,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5,<6",
  "boto3>=1.35,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "pillow>=11,<12",
  "pytesseract>=0.3.13,<1",
  "numpy>=2.1,<3",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
